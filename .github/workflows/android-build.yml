name: Sahm Download Manager — Android CI & Release Build

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type to Produce'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - debug_only
          - release_only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # 1. Debug Build & Unit Tests (Always Runs Without Secrets)
  # --------------------------------------------------------------------------
  build-debug:
    name: Build Debug APK & Run Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.build_type != 'release_only'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Make Gradlew Executable & Verify Wrapper
        run: |
          chmod +x android/gradlew
          cd android
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Regenerating gradle-wrapper.jar with Gradle 8.9..."
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi


      - name: Run Android Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename and Stage Debug APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/sahm-download-manager-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahm-download-manager-debug-apk
          path: output/sahm-download-manager-debug.apk
          retention-days: 14

  # --------------------------------------------------------------------------
  # 2. Release AAB & Signed APK Build (Runs When Signing Secrets Configured)
  # --------------------------------------------------------------------------
  build-release:
    name: Build Production AAB & Signed APK
    runs-on: ubuntu-latest
    needs: build-debug
    if: |
      always() && 
      (needs.build-debug.result == 'success' || github.event.inputs.build_type == 'release_only') &&
      github.event.inputs.build_type != 'debug_only'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Make Gradlew Executable & Verify Wrapper
        run: |
          chmod +x android/gradlew
          cd android
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Regenerating gradle-wrapper.jar with Gradle 8.9..."
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi


      - name: Decode Release Keystore (If Configured)
        id: setup_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SAHM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SAHM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SAHM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SAHM_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Release signing credentials detected in repository secrets."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/sahm-release.keystore
            echo "has_signing=true" >> $GITHUB_OUTPUT
          else
            echo "Release signing secrets not found. Building unsigned/debug release bundle."
            echo "has_signing=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Android App Bundle (AAB) & Release APK
        env:
          SAHM_KEYSTORE_PATH: sahm-release.keystore
          SAHM_KEYSTORE_PASSWORD: ${{ secrets.SAHM_KEYSTORE_PASSWORD }}
          SAHM_KEY_ALIAS: ${{ secrets.SAHM_KEY_ALIAS }}
          SAHM_KEY_PASSWORD: ${{ secrets.SAHM_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Stage Release Artifacts
        run: |
          mkdir -p release-output
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab release-output/sahm-download-manager-release.aab
          fi
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-output/sahm-download-manager-release.apk
          fi

      - name: Upload Production AAB Artifact (For Google Play Console)
        if: hashFiles('release-output/sahm-download-manager-release.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sahm-download-manager-release-aab
          path: release-output/sahm-download-manager-release.aab
          retention-days: 30

      - name: Upload Release APK Artifact
        if: hashFiles('release-output/sahm-download-manager-release.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sahm-download-manager-release-apk
          path: release-output/sahm-download-manager-release.apk
          retention-days: 30

      - name: Clean Up Keystore File
        if: always()
        run: |
          rm -f android/sahm-release.keystore
